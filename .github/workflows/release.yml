# Publishes @authfi/sdk to npm when a version tag (vX.Y.Z) is pushed, with npm trusted publishing: GitHub
# proves to npm which repository, workflow and environment is publishing (OIDC), so there is no npm token
# to leak or rotate, and the package carries a provenance statement. The trusted publisher on npmjs.com names
# this repository, this file and the `npm` environment. The `npm` environment needs a reviewer's approval
# before the publish job starts.
name: Release to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Built and tested without the publishing permission, so nothing the build runs can obtain an npm credential.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag on the wrong commit must fail here: a version on npm can never be replaced.
      - name: The tag is a version on main, with a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          v="${TAG#v}"
          [ "$(node -p "require('./package.json').version")" = "$v" ] || { echo "::error::package.json version is not $v"; exit 1; }
          grep -Eq "^## \[?${v//./\\.}\]?( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:browser
      - run: npm run check:dual
      - name: Pack the tarball that will be published
        run: |
          mkdir -p out
          npm pack --pack-destination out
          ls out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@authfi/sdk
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      # Node 24 ships npm 11; trusted publishing needs npm 11.5.1 or later (Node 22 ships npm 10).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Check npm can publish with trusted publishing
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('npm '+process.argv[1]+' is older than 11.5.1: trusted publishing needs 11.5.1 or later'); process.exit(1); }" "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out/
      # The tarball built above, not a rebuild: what was tested is what is published.
      - name: Publish with provenance
        run: npm publish out/*.tgz --provenance --access public
