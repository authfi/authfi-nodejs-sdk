name: Live

# The live suite against platform-beta. Never on a pull request: it runs on main and on demand only,
# in the protected `platform-beta` environment (required reviewers), whose secrets are the
# credentials of `sdk-live-ci`, a machine client of the testing tenant that belongs to no person.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    name: live
    runs-on: ${{ vars.SDK_RUNNER || 'ubuntu-latest' }}
    environment: platform-beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the live suite against platform-beta
        env:
          AUTHFI_LIVE_ISSUER: https://platform-beta.authfi.io
          AUTHFI_LIVE_CLIENT_ID: ${{ secrets.AUTHFI_LIVE_CLIENT_ID }}
          AUTHFI_LIVE_CLIENT_SECRET: ${{ secrets.AUTHFI_LIVE_CLIENT_SECRET }}
        run: npm run test:live
